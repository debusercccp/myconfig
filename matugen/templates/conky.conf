conky.config = {
    alignment = 'top_right',
    background = false,
    update_interval = 1,
    
    -- Colori di base esportati da Matugen
    default_color = '{{colors.on_surface.default.hex}}',
    color1 = '{{colors.primary.default.hex}}',
    color2 = '{{colors.secondary.default.hex}}',
    color3 = '{{colors.error.default.hex}}',
    
    -- Sfondo della finestra (se usi own_window)
    own_window = true,
    own_window_transparent = false,
    own_window_colour = '{{colors.surface.default.hex}}',
}

conky.text = [[
${color1}SISTEMA ${hr 2}${color}
CPU: $cpu% ${cpubar}
${color2}RAM: $mem/$memmax${color}

${color3}Attenzione: Esempio errore${color}
]]
