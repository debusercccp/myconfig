conky.config = {
    out_to_x = false,
    out_to_wayland = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'conky',
    own_window_colour = '{{colors.surface.default.hex_stripped}}cc',

    draw_borders = true,
    border_width = 1,
    default_outline_color = '{{colors.outline_variant.default.hex}}',

    minimum_width = 340,
    maximum_width = 360,
    border_inner_margin = 18,
    border_outer_margin = 0,

    alignment = 'top_right',
    gap_x = 24,
    gap_y = 56,

    update_interval = 1.0,
    double_buffer = true,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=11',

    default_color = '{{colors.on_surface.default.hex}}',
    color1 = '{{colors.primary.default.hex}}',
    color2 = '{{colors.secondary.default.hex}}',
    color3 = '{{colors.on_surface_variant.default.hex}}',
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:bold:size=13}󰍹 SISTEMA ${hr 2}${font}${color}
${voffset 6}${color2} CPU:${color} ${goto 115}$cpu% ${alignr}${color1}${cpubar 7, 130}${color}
${voffset 4}${color2} RAM:${color} ${goto 115}$mem ${alignr}${color1}${membar 7, 130}${color}
${voffset 1}${goto 115}${color3}${font :size=9}($memperc% di $memmax)${font}${color}

${voffset 4}${color1}${font JetBrainsMono Nerd Font:bold:size=13} STORAGE ${hr 2}${font}${color}
${voffset 6}${color2} SSD (/):${color} ${goto 115}${fs_used /} ${alignr}${color1}${fs_bar 7, 130 /}${color}
${voffset 1}${goto 115}${color3}${font :size=9}($fs_used_perc% di $fs_size - Lib: $fs_free)${font}${color}

${voffset 4}${color1}${font JetBrainsMono Nerd Font:bold:size=13}󰒢 RETE ${hr 2}${font}${color}
${voffset 6}${color2} IN:${color}  ${goto 115}${downspeed wlan0} ${alignr}${color3}${font :size=9.5}Tot: ${totaldown wlan0}${font}${color}
${voffset 4}${color2} OUT:${color} ${goto 115}${upspeed wlan0} ${alignr}${color3}${font :size=9.5}Tot: ${totalup wlan0}${font}${color}

${voffset 8}${color2}󱑎 UPTIME:${color} ${alignr}$uptime_short
]]
